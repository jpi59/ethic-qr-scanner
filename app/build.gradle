plugins {
    id 'com.android.application'
}

// Release credentials are provided only through the invoking environment.
// This repository never stores keystore locations, aliases, or passwords.
def releaseKeystorePath = System.getenv('KEYSTORE_PATH')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseStorePassword = System.getenv('STORE_PASSWORD')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeyAlias, releaseStorePassword, releaseKeyPassword]
        .every { it != null && !it.isEmpty() }

android {
    namespace 'org.jpi59.ethicqrscanner'
    compileSdk 36

    defaultConfig {
        applicationId 'org.jpi59.ethicqrscanner'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            vcsInfo { include = false }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.google.zxing:core:3.5.4'
}
